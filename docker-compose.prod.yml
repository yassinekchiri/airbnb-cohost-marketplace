# Production stack: Caddy (auto-TLS) -> gunicorn -> Postgres/Redis.
# Secrets are mounted as files under /run/secrets (see docs/ARCHITECTURE.md §5),
# never passed as environment variables.
#
#   ./setup.sh prod          # generates secrets + starts everything
#   docker compose -f docker-compose.prod.yml --env-file .env.prod ps

name: cohost

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-django-env: &django-env
  DJANGO_LOG_LEVEL: WARNING
  LOG_TO_FILE: "False"
  BEHIND_PROXY: "True"
  DEBUG: "False"
  ALLOWED_HOSTS: ${DOMAIN:?run ./setup.sh secrets first}
  CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
  SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-300}
  SESSION_COOKIE_SECURE: "True"
  CSRF_COOKIE_SECURE: "True"
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@${DOMAIN}}
  SECRET_KEY_FILE: /run/secrets/secret_key
  DATABASE_URL_FILE: /run/secrets/database_url
  CACHE_URL_FILE: /run/secrets/cache_url
  EMAIL_HOST_PASSWORD_FILE: /run/secrets/email_host_password
  SENTRY_DSN_FILE: /run/secrets/sentry_dsn

services:
  caddy:
    <<: *hardening
    cap_add: [NET_BIND_SERVICE]
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web: { condition: service_healthy }

  web:
    <<: *hardening
    build: .
    image: ${WEB_IMAGE:-cohost-web:latest}
    environment:
      <<: *django-env
      # Scraping still runs inside the request until Celery (Phase 6) lands.
      GUNICORN_TIMEOUT: "330"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
    secrets: [secret_key, database_url, cache_url, email_host_password, sentry_dsn]
    volumes:
      - media:/app/media
    read_only: true
    tmpfs:
      - /tmp
      - /home/app:uid=10001,gid=10001   # webdriver cache etc.
    shm_size: 512m                       # Chromium
    networks: [edge, backend]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  migrate:
    build: .
    image: ${WEB_IMAGE:-cohost-web:latest}
    restart: "no"
    command: python manage.py migrate --noinput
    environment: *django-env
    secrets: [secret_key, database_url, cache_url, email_host_password, sentry_dsn]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }

  db:
    <<: *hardening
    cap_drop: []   # postgres entrypoint needs chown/setuid on first boot
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cohost
      POSTGRES_USER: cohost
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cohost -d cohost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *hardening
    image: redis:7-alpine
    # password read from the secret file at start; no persistence needed (cache only)
    command: ["sh", "-c", "exec redis-server --save '' --appendonly no --requirepass \"$$(cat /run/secrets/redis_password)\""]
    secrets: [redis_password]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    <<: *hardening
    cap_drop: []
    image: prodrigestivill/postgres-backup-local:16
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: cohost
      POSTGRES_USER: cohost
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    secrets: [postgres_password]
    volumes: [pgbackups:/backups]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }

  # ── Phase 6 (uncomment once the Celery task exists) ───────────────────────
  # scraper:
  #   <<: *hardening
  #   build: { context: ., target: scraper }   # separate image: Chromium, NO db/secret access
  #   command: celery -A helloworld worker -Q scrape -c 2 --max-tasks-per-child 20
  #   environment: { CELERY_BROKER_URL_FILE: /run/secrets/broker_url }
  #   secrets: [broker_url]
  #   read_only: true
  #   tmpfs: [/tmp]
  #   networks: [backend, scraper_egress]

networks:
  edge: {}
  backend:
    internal: true      # db/redis/backup cannot reach the internet or be reached from it
    # NOTE: web & migrate sit on `edge` too only where they need egress (scraper, SMTP, Sentry)

volumes:
  pgdata:
  pgbackups:
  media:
  caddy_data:
  caddy_config:

secrets:
  secret_key:         { file: ./secrets/secret_key }
  database_url:       { file: ./secrets/database_url }
  cache_url:          { file: ./secrets/cache_url }
  postgres_password:  { file: ./secrets/postgres_password }
  redis_password:     { file: ./secrets/redis_password }
  email_host_password: { file: ./secrets/email_host_password }
  sentry_dsn:         { file: ./secrets/sentry_dsn }

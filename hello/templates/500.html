<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Error — CoHostr</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fafafa;
      color: #222;
    }
    .error-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1.5rem;
    }
    .error-code {
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      line-height: 1;
      color: #FF5A5F;
      opacity: 0.15;
    }
    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 700;
      margin: -2rem 0 1rem;
    }
    .error-message {
      font-size: 1.1rem;
      color: #555;
      max-width: 480px;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 0.85rem 2rem;
      background: #FF5A5F;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
    }
    .btn:hover { background: #e04f54; }
  </style>
</head>
<body>
<div class="error-page">
  <p class="error-code">500</p>
  <h1 class="error-title">Something went wrong</h1>
  <p class="error-message">
    We're sorry — an unexpected error occurred on our end. Our team has been notified. Please try again in a moment.
  </p>
  <a href="/" class="btn">Back to marketplace</a>
</div>
</body>
</html>

{% extends 'hello/base.html' %}

{% block title %}Password Reset — CoHost{% endblock %}

{% block extra_css %}
<style>body { background: var(--gradient-dark); }</style>
{% endblock %}

{% block content %}
<div class="ds-auth-wrap">
  <div class="ds-auth-card" style="text-align:center;">
    <div style="font-size:2.5rem;margin-bottom:1rem;">✅</div>
    <div class="ds-auth-logo">Password reset!</div>
    <div class="ds-auth-subtitle" style="margin-bottom:1.5rem;">
      Your password has been set. You can now log in with your new password.
    </div>
    <a href="{% url 'login' %}" class="ds-btn ds-btn-primary" style="display:inline-flex;border-radius:0.75rem;padding:0.875rem 2rem;">Log in</a>
  </div>
</div>
{% endblock %}

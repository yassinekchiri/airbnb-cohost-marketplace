<!DOCTYPE html>
<html>
<head>
    <title>Test CSRF Form</title>
</head>
<body>
    <h1>Test CSRF Form</h1>
    <form method="post">
        {% csrf_token %}
        <label>Test Input:</label>
        <input type="text" name="test_input" required>
        <button type="submit">Submit</button>
    </form>
    
    {% if request.method == 'POST' %}
        <p>Form submitted successfully!</p>
        <p>Test input: {{ request.POST.test_input }}</p>
    {% endif %}
</body>
</html>

<nav class="ds-nav">
  <div class="ds-nav-inner">
    <a href="{% url 'marketplace_home' %}" class="ds-nav-logo">
      <div class="ds-logo-icon">C</div>
      CoHostr
    </a>

    <div class="ds-nav-links" id="ds-nav-links">
      <a href="{% url 'marketplace_home' %}" class="ds-nav-link">Home</a>
      <a href="{% url 'listings_marketplace' %}" class="ds-nav-link">Rentals</a>
      <a href="{% url 'cohosts_marketplace' %}" class="ds-nav-link">Co-Hosts</a>
      {% if user.is_authenticated %}
        {% if user.userprofile.role == 'host' %}
          <a href="{% url 'host_dashboard' %}" class="ds-nav-link">Dashboard</a>
        {% elif user.userprofile.role == 'cohost' %}
          <a href="{% url 'cohost_dashboard' %}" class="ds-nav-link">Dashboard</a>
        {% endif %}
        <a href="{% url 'inbox' %}" class="ds-nav-link" style="position:relative;">
          Messages
          <span class="ds-nav-badge" id="nav-badge"></span>
        </a>
        <a href="{% url 'edit_profile' %}" class="ds-nav-link">My Profile</a>
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="ds-nav-logout">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}" class="ds-nav-link">Login</a>
        <a href="{% url 'register' %}" class="ds-nav-link ds-nav-join">Join Now</a>
      {% endif %}
    </div>

    <!-- Mobile hamburger -->
    <button class="ds-nav-toggle" id="ds-nav-toggle" aria-label="Toggle menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>
</nav>

{% if user.is_authenticated %}
<script>
fetch('{% url "api_unread_count" %}').then(function(r){return r.json();}).then(function(d){
  var b = document.getElementById('nav-badge');
  if (b && d.unread > 0) { b.textContent = d.unread > 99 ? '99+' : d.unread; b.style.display = 'inline'; }
}).catch(function(){});
</script>
{% endif %}

name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install ruff==0.8.4 actionlint-py==1.7.7.23
      - run: ruff check . --output-format github
      - name: Lint workflows
        run: actionlint
      - name: Lint shell scripts
        run: bash -n setup.sh && bash -n deploy/remote-deploy.sh && bash -n deploy/server-bootstrap.sh

  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: cohost, POSTGRES_USER: cohost, POSTGRES_PASSWORD: ci-only }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cohost" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-a-real-secret-0123456789abcdef0123456789abcdef
      DEBUG: "False"
      LOG_TO_FILE: "False"
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://cohost:ci-only@localhost:5432/cohost' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run
      - name: Deployment checklist (fails on any warning)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          ALLOWED_HOSTS: example.com
          SECURE_SSL_REDIRECT: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
      - name: Tests
        run: pytest --create-db -p no:cacheprovider

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Known-vulnerable dependencies
        run: pip install pip-audit==2.7.3 && pip-audit -r requirements.txt --strict
      - name: Leaked secrets in history
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  image:
    name: image + full-stack smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: cohost-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cohost-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: os,library
      - name: Start the stack (Postgres + Redis + gunicorn)
        run: docker compose -f docker-compose.ci.yml up -d --wait --wait-timeout 120
      - name: Smoke test
        run: python3 deploy/smoke.py http://127.0.0.1:8000
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # One stable name for branch protection: require "CI / ci-ok" and nothing else.
  # (Matrix job names change; this does not. `if: always()` so a skipped/cancelled
  # needed job can never turn the gate green.)
  ci-ok:
    if: always()
    needs: [lint, test, security, image]
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

  publish:
    name: publish signed image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ci-ok]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signature
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:master
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image digest (keyless, tied to this workflow)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

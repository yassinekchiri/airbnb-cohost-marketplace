name: Deploy

# Automatic: every green master build -> NUC staging -> (human approval) -> production.
# Manual:    Actions > Deploy > Run workflow, with a git SHA, to deploy or ROLL BACK to any
#            previously built image. Tick skip_staging if the NUC is offline.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA (40 chars) of an image already published by CI"
        required: true
      skip_staging:
        description: "Skip the NUC staging gate (use when the NUC is offline)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve + verify image
    # Off until the owner sets the repository variable DEPLOY_ENABLED=true (NUC runner + production VM + secrets ready).
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: { contents: read, packages: read }
    outputs:
      ref: ${{ steps.pin.outputs.ref }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@v3
      - id: pin
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          sha="${INPUT_TAG:-$RUN_SHA}"
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "not a full git SHA: $sha"; exit 1; }
          image="ghcr.io/${REPO,,}"
          docker pull "$image:$sha" >/dev/null
          ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$sha")
          [[ $ref == "$image@sha256:"* ]] || { echo "unexpected digest ref: $ref"; exit 1; }
          # Only images built and signed by THIS repo's CI workflow on master may reach production.
          cosign verify "$ref" \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/ci.yml@refs/heads/master" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "ref=$ref" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016  # backticks are literal markdown
          printf '### Image\n`%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: staging (NUC)
    needs: resolve
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_staging) }}
    runs-on: [self-hosted, nuc]
    timeout-minutes: 20
    environment: staging
    permissions: { contents: read, packages: read }
    concurrency: { group: nuc-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Start the exact image that will ship
        env: { WEB_IMAGE: "${{ needs.resolve.outputs.ref }}", WEB_PORT: "8081" }
        run: docker compose -p cohost-staging -f docker-compose.ci.yml up -d --wait --wait-timeout 180 --pull always --force-recreate
      - name: Smoke test (full flow)
        run: python3 deploy/smoke.py http://127.0.0.1:8081
      - name: Logs on failure
        if: failure()
        run: docker compose -p cohost-staging -f docker-compose.ci.yml logs --no-color --tail=200

  production:
    needs: [resolve, staging]
    # Runs when staging passed OR was deliberately skipped, never when it failed.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.staging.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Add "Required reviewers" to this environment in GitHub: that is the approval gate
    # (approve from the GitHub mobile app).
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    concurrency: { group: deploy-production, cancel-in-progress: false }
    permissions: { contents: read, packages: read }
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      SITE_URL: ${{ vars.SITE_URL }}
      IMAGE_REF: ${{ needs.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - name: Join the tailnet (ephemeral node, tag:ci)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: SSH setup (pinned host key)
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOSTKEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$HOST" "$HOSTKEY" > ~/.ssh/known_hosts
          printf 'Host prod\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_ed25519\n  StrictHostKeyChecking yes\n  ServerAliveInterval 15\n' "$HOST" > ~/.ssh/config
      - name: Ship config (compose, Caddyfile, setup.sh)
        run: tar czf - docker-compose.prod.yml Caddyfile setup.sh | ssh prod 'mkdir -p /opt/cohost/incoming && tar xzf - -C /opt/cohost/incoming'
      - name: Registry login on the server (job-scoped token, removed afterwards)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", ACTOR: "${{ github.actor }}" }
        run: |
          # shellcheck disable=SC2029  # ACTOR is meant to expand locally
          printf '%s' "$GH_TOKEN" | ssh prod "docker login ghcr.io -u '$ACTOR' --password-stdin"
      - name: Deploy
        env:
          DOMAIN: ${{ vars.SITE_DOMAIN }}
          ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          # shellcheck disable=SC2029  # IMAGE_REF is meant to expand locally
          # Secrets travel on stdin, never on a command line.
          {
            printf 'export DOMAIN=%q ACME_EMAIL=%q EMAIL_HOST_PASSWORD=%q SENTRY_DSN=%q\n' \
              "$DOMAIN" "$ACME_EMAIL" "$EMAIL_HOST_PASSWORD" "$SENTRY_DSN"
            cat deploy/remote-deploy.sh
          } | ssh prod "bash -s -- '$IMAGE_REF'"
      - name: Verify from the outside (read-only smoke)
        id: verify
        run: |
          sleep 5
          python3 deploy/smoke.py "$SITE_URL" --readonly
      - name: Roll back if the public site is unhealthy
        if: failure() && steps.verify.outcome == 'failure'
        run: ssh prod "bash -s -- --rollback" < deploy/remote-deploy.sh
      - name: Remove registry credential from the server
        if: always()
        run: ssh prod 'docker logout ghcr.io' || true
      - name: Summary
        if: always()
        run: |
          {
            echo "### Production"
            echo "- image: \`$IMAGE_REF\`"
            echo "- result: ${{ job.status }}"
            echo "- roll back later: Actions > Deploy > Run workflow > image_tag = an earlier SHA"
          } >> "$GITHUB_STEP_SUMMARY"
